name: Build Android APK & Publish Website

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare debug keystore & env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK & Run Tests
        run: gradle assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: baby-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare Public Download Website & APK Bundle
        run: |
          rm -rf _site
          mkdir -p _site/downloads
          cp -r docs/* _site/
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_PATH" _site/downloads/Baby-Assistant.apk
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          UPDATED_AT=$(date -u +"%d %b %Y, %H:%M UTC")
          cat > _site/downloads/release-info.json <<EOF
          {
            "appName": "Baby Assistant",
            "version": "1.0",
            "minAndroid": "Android 7.0+ (API 24)",
            "packageId": "com.aistudio.babyvoice.xkmzqp",
            "apkUrl": "./downloads/Baby-Assistant.apk",
            "fallbackReleasesUrl": "https://github.com/${{ github.repository }}/releases",
            "apkSize": "${APK_SIZE}",
            "sha256": "${APK_SHA256}",
            "updatedAt": "${UPDATED_AT}"
          }
          EOF

      - name: Publish Public APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest _site/downloads/Baby-Assistant.apk --clobber
          else
            gh release create latest _site/downloads/Baby-Assistant.apk \
              --title "Baby Assistant Latest APK" \
              --notes "Latest automated Android build of Baby Assistant (Hands-Free Voice Call Assistant with Auto-Mic on Incoming Call)."
          fi

      - name: Upload GitHub Pages Website Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Public Download Website to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
